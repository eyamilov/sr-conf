[General]
bypass-system = true
dns-server = https://cloudflare-dns.com/dns-query
dns-fallback = https://dns.google/dns-query
dns-direct-system = false
dns-direct-fallback = https://cloudflare-dns.com/dns-query
ipv6 = true
prefer-ipv6 = false

[Proxy Group]
TRUSTED = url-test,LOCAL-SERVERS,interval=300,tolerance=100,timeout=5,url=https://cp.cloudflare.com/generate_204
PUBLIC = url-test,BLACK_VLESS_RUS,interval=3600,tolerance=100,timeout=5,url=https://cp.cloudflare.com/generate_204
PUBLIC-TOP = url-test,PUBLIC,interval=300,tolerance=100,timeout=5,url=https://cp.cloudflare.com/generate_204
AUTO = fallback,TRUSTED,PUBLIC-TOP

[Rule]
RULE-SET,https://raw.githubusercontent.com/eyamilov/sr-conf/refs/heads/main/rules/chatgpt.list,AUTO
RULE-SET,https://raw.githubusercontent.com/eyamilov/sr-conf/refs/heads/main/rules/claude.list,AUTO
RULE-SET,https://raw.githubusercontent.com/eyamilov/sr-conf/refs/heads/main/rules/grok.list,AUTO
RULE-SET,https://raw.githubusercontent.com/eyamilov/sr-conf/refs/heads/main/rules/instagram.list,AUTO
RULE-SET,https://raw.githubusercontent.com/eyamilov/sr-conf/refs/heads/main/rules/linkedin.list,AUTO
RULE-SET,https://raw.githubusercontent.com/eyamilov/sr-conf/refs/heads/main/rules/voice-ports.list,AUTO
RULE-SET,https://raw.githubusercontent.com/eyamilov/sr-conf/refs/heads/main/rules/whatsapp.list,AUTO
RULE-SET,https://raw.githubusercontent.com/eyamilov/sr-conf/refs/heads/main/rules/youtube.list,AUTO
FINAL,DIRECT
