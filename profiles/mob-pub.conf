[General]
bypass-system = true
dns-server = https://cloudflare-dns.com/dns-query
dns-fallback = https://dns.google/dns-query
dns-direct-system = true
dns-direct-fallback = system
ipv6 = true
prefer-ipv6 = false

[Proxy Group]
PROXY = select, mobile_public_group, DIRECT

[Rule]
DOMAIN-SUFFIX, youtube.com, PROXY
DOMAIN-SUFFIX, googlevideo.com, PROXY
DOMAIN-SUFFIX, whatsapp.com, PROXY
DOMAIN-SUFFIX, whatsapp.net, PROXY
DOMAIN-SUFFIX, 2ip.ru, PROXY
DOMAIN-SUFFIX, dnsleaktest.com, PROXY
FINAL, DIRECT
