[General]
bypass-system = true
dns-server = https://dns.adguard-dns.com/dns-query
dns-fallback = https://cloudflare-dns.com/dns-query
dns-direct-system = false
dns-direct-fallback = https://dns.adguard-dns.com/dns-query
ipv6 = true
prefer-ipv6 = false

[Proxy Group]
AUTO = url-test,LOCAL-SERVERS,interval=600,tolerance=100,timeout=5,url=https://cp.cloudflare.com/generate_204

[Rule]
RULE-SET,https://raw.githubusercontent.com/eyamilov/sr-conf/refs/heads/main/rules/direct.list,DIRECT
FINAL,AUTO
